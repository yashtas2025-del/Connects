<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Connects — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f1628;
  --navy2: #1a2540;
  --navy3: #243050;
  --accent: #c9a84c;
  --accent2: #e8c97a;
  --white: #f8f6f0;
  --muted: #8a8fa8;
  --card: #1e2d4a;
  --border: rgba(255,255,255,0.07);
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--navy); color: var(--white); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

/* Header */
.header { background: var(--navy2); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--navy); font-weight: 700; }
.brand-name { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--white); letter-spacing: 0.3px; }
.brand-sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.refresh-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 8px; background: none; color: var(--muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
.refresh-btn svg { width: 14px; height: 14px; }

/* Main */
.main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; position: relative; overflow: hidden; }
.stat::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); }
.stat-val { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--white); line-height: 1; margin-bottom: 6px; }
.stat-label { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.4px; text-transform: uppercase; }

/* Filters */
.filters { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-right: 4px; white-space: nowrap; }
.filter-group { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 180px; }
select, input[type="text"] {
  flex: 1; padding: 9px 14px; background: var(--navy2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 13px;
  outline: none; transition: border-color 0.2s; appearance: none; cursor: pointer;
}
select:focus, input[type="text"]:focus { border-color: var(--accent); }
select option { background: var(--navy2); }
.clear-btn { padding: 9px 16px; background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.clear-btn:hover { color: var(--white); border-color: var(--muted); }

/* Results bar */
.results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.results-count { font-size: 13px; color: var(--muted); }
.results-count strong { color: var(--white); }

/* Cards */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; transition: border-color 0.2s, transform 0.15s; animation: fadeIn 0.25s ease; }
.card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-1px); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 12px; }
.card-names { font-family: 'DM Serif Display', serif; font-size: 17px; color: var(--white); line-height: 1.3; }
.card-names .met { color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 14px; font-style: italic; margin: 0 6px; }
.card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.badge { font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 99px; letter-spacing: 0.3px; white-space: nowrap; }
.badge-bd    { background: rgba(59,130,246,0.15); color: #93c5fd; }
.badge-part  { background: rgba(34,197,94,0.15);  color: #86efac; }
.badge-client{ background: rgba(20,184,166,0.15); color: #5eead4; }
.badge-inv   { background: rgba(168,85,247,0.15); color: #d8b4fe; }
.badge-reg   { background: rgba(245,158,11,0.15); color: #fcd34d; }
.badge-int   { background: rgba(236,72,153,0.15); color: #f9a8d4; }
.badge-net   { background: rgba(59,130,246,0.15); color: #93c5fd; }
.badge-oth   { background: rgba(148,163,184,0.15);color: #94a3b8; }
.card-meta { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px; }
.meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.meta-item strong { color: #cbd5e1; font-weight: 500; }
.meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); }
.card-notes { border-top: 1px solid var(--border); padding-top: 10px; font-size: 13px; color: #94a3b8; line-height: 1.6; }
.card-next { margin-top: 6px; font-size: 12px; color: var(--accent2); font-weight: 500; }
.card-next::before { content: '→ '; }

/* Director avatars */
.avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }

/* Empty / Loading */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
.empty p { font-size: 15px; }
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 32px; height: 32px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading p { font-size: 14px; color: var(--muted); }

/* Error */
.error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius); padding: 20px 24px; color: #fca5a5; font-size: 14px; line-height: 1.7; }
.error-box strong { display: block; margin-bottom: 6px; font-size: 15px; }

/* Month divider */
.month-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }
.month-divider span { font-size: 12px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
.month-divider::before, .month-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.month-divider::before { display: none; }

@media(max-width: 700px) {
  .stats { grid-template-columns: 1fr 1fr; }
  .header { padding: 0 16px; }
  .main { padding: 20px 16px; }
  .card-top { flex-direction: column; }
  .filters { flex-direction: column; }
  .filter-group { width: 100%; }
}
</style>
</head>

function parseDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val) ? null : val;
  // Google Sheets serial number
  if (typeof val === 'number') {
    const d = new Date((val - 25569) * 86400 * 1000);

  const s = String(val).trim();

  // Try native parse (handles "Mon Apr 27 2026...", ISO strings, etc.)
  const d = new Date(s);
  if (!isNaN(d)) return d;
  // Last resort: extract yyyy-mm-dd pattern from anywhere in string
  const match = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (match) return new Date(parseInt(match[1]), parseInt(match[2])-1, parseInt(match[3]));
  return null;
}

function formatDate(val) {
  const d = parseDate(val);
  if (!d) return "—";
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function dateToYYYYMM(val) {
  const d = parseDate(val);
  if (!d) return "";
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

async function loadData() {
  document.getElementById('content').innerHTML = `<div class="loading"><div class="spinner"></div><p>Loading connects…</p></div>`;
  try {
    const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
    const json = await res.json();
    allRows = (json.rows || []).reverse(); // newest first
    populateMonthFilter();
    updateStats(allRows);
    applyFilters();
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <div class="error-box">
        <strong>Could not load data</strong>
        Make sure the SCRIPT_URL in this file is set to your Google Apps Script Web App URL,
        and that the script is deployed with "Anyone" access. Then refresh the page.
        <br><br><em>Error: ${e.message}</em>
      </div>`;
  }
}

function populateMonthFilter() {
  const months = [...new Set(allRows.map(r => dateToYYYYMM(r["Meeting Date"])).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('f-month');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Months</option>' + months.map(m => {
    const [y, mo] = m.split('-');
    const label = new Date(y, mo-1).toLocaleString('default', { month: 'long', year: 'numeric' });
    return `<option value="${m}"${m===cur?' selected':''}>${label}</option>`;
  }).join('');
}

function updateStats(rows) {
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthCount = rows.filter(r => dateToYYYYMM(r["Meeting Date"]) === thisMonth).length;
  const companies = new Set(rows.map(r => r["Their Company"]).filter(Boolean)).size;
  const directors = new Set(rows.map(r => r["Director Name"]).filter(Boolean)).size;
  document.getElementById('stats').innerHTML = [
    [rows.length, "Total Connects"],
    [monthCount,  "This Month"],
    [companies,   "Companies Met"],
    [directors,   "Directors Active"]
  ].map(([v,l]) => `<div class="stat"><div class="stat-val">${v}</div><div class="stat-label">${l}</div></div>`).join('');
}

function applyFilters() {
  const dir    = document.getElementById('f-director').value;
  const type   = document.getElementById('f-type').value;
  const month  = document.getElementById('f-month').value;
  const search = document.getElementById('f-search').value.toLowerCase();

  let filtered = allRows.filter(r => {
    if (dir   && r["Director Name"] !== dir) return false;
    if (type  && r["Meeting Type"]  !== type) return false;
    if (month && dateToYYYYMM(r["Meeting Date"]) !== month) return false;
    if (search) {
      const blob = [r["Director Name"],r["Person Met"],r["Their Company"],r["Discussion / Outcome"],r["Next Steps"],r["Meeting Type"]].join(' ').toLowerCase();
      if (!blob.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('results-count').innerHTML = `Showing <strong>${filtered.length}</strong> of <strong>${allRows.length}</strong> connects`;
  renderCards(filtered);
}

function clearFilters() {
  document.getElementById('f-director').value = '';
  document.getElementById('f-type').value = '';
  document.getElementById('f-month').value = '';
  document.getElementById('f-search').value = '';
  applyFilters();
}

function renderCards(rows) {
  const content = document.getElementById('content');
  if (!rows.length) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>No connects match your filters.</p></div>`;
    return;
  }

  // Group by month
  const groups = {};
  rows.forEach(r => {
    const d = r["Meeting Date"] || "";
    const key = dateToYYYYMM(d);
    const label = key ? new Date(key + '-01').toLocaleString('default', { month: 'long', year: 'numeric' }) : "Unknown";
    if (!groups[label]) groups[label] = [];
    groups[label].push(r);
  });

  let html = '';
  for (const [month, items] of Object.entries(groups)) {
    html += `<div class="month-divider"><span>${month}</span></div>`;
    items.forEach(r => {
      const dirIdx = DIRECTORS.indexOf(r["Director Name"]);
      const avatarColor = AVATAR_COLORS[dirIdx >= 0 ? dirIdx : 0];
      const initials = (r["Director Name"] || "?").split(' ').map(w=>w[0]).join('').slice(0,2);
      const badgeClass = BADGE[r["Meeting Type"]] || "badge-oth";
      const dateStr = formatDate(r["Meeting Date"]);

      html += `<div class="card">
        <div class="card-top">
          <div class="card-names">
            <span class="avatar" style="background:${avatarColor}22;color:${avatarColor};display:inline-flex;vertical-align:middle;margin-right:6px;">${initials}</span>
            ${r["Director Name"] || "—"}
            <span class="met">met</span>
            ${r["Person Met"] || "—"}
          </div>
          <div class="card-right">
            <span class="badge ${badgeClass}">${r["Meeting Type"] || "—"}</span>
          </div>
        </div>
        <div class="card-meta">
          <div class="meta-item">📅 <strong>${dateStr}</strong></div>
          ${r["Their Company"] ? `<div class="meta-item">🏢 <strong>${r["Their Company"]}</strong></div>` : ''}
          ${r["Title"] ? `<div class="meta-item">👤 ${r["Title"]}</div>` : ''}
        </div>
        ${r["Discussion / Outcome"] || r["Next Steps"] ? `
        <div class="card-notes">
          ${r["Discussion / Outcome"] || ''}
          ${r["Next Steps"] ? `<div class="card-next">${r["Next Steps"]}</div>` : ''}
        </div>` : ''}
      </div>`;
    });
  }
  content.innerHTML = html;
}

loadData();
</script>
</body>
</html>

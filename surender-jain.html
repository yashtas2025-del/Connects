<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log a Connect</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.card { background: #fff; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 480px; box-shadow: 0 2px 24px rgba(0,0,0,0.08); }
.logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.logo-dot { width: 32px; height: 32px; background: #1a1a2e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; }
.logo-text { font-size: 13px; font-weight: 600; color: #1a1a2e; }
.greeting { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
.director-badge { display: inline-flex; align-items: center; gap: 6px; background: #f0f0f8; border-radius: 8px; padding: 7px 14px; margin-bottom: 24px; font-size: 13px; font-weight: 600; color: #3d3d8f; }
.director-badge span { font-weight: 400; color: #666; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 11px; font-weight: 700; color: #555; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
input, select, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid #e8e8e8; border-radius: 10px; font-size: 15px; color: #1a1a2e; background: #fafafa; font-family: inherit; transition: border-color 0.2s, background 0.2s; outline: none; }
input:focus, select:focus, textarea:focus { border-color: #3d3d8f; background: #fff; }
textarea { resize: vertical; min-height: 80px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.submit-btn { width: 100%; padding: 14px; background: #1a1a2e; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s; font-family: inherit; }
.submit-btn:hover { background: #2d2d5e; }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { background: #aaa; cursor: not-allowed; }
.success-screen { display: none; text-align: center; padding: 20px 0; }
.success-icon { width: 64px; height: 64px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 28px; color: #2e7d32; }
.success-title { font-size: 20px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
.success-sub { font-size: 14px; color: #888; margin-bottom: 24px; }
.another-btn { padding: 11px 28px; border: 1.5px solid #1a1a2e; background: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #1a1a2e; font-family: inherit; }
.req { color: #e05; }
@media(max-width:400px) { .row-2 { grid-template-columns: 1fr; } .card { padding: 28px 20px; } }
</style>
</head>
<body>
<div class="card">
  <div class="logo-row">
    <div class="logo-dot">SC</div>
    <div class="logo-text">Senior Connects</div>
  </div>
  <div id="form-section">
    <div class="greeting">Log a Connect</div>
    <div class="subtitle">Takes less than a minute. Your entry goes straight to the tracker.</div>
    <div class="director-badge">Surender Jain <span>&nbsp;·&nbsp; Director</span></div>
    <div class="row-2">
      <div class="field">
        <label>Date of meeting <span class="req">*</span></label>
        <input type="date" id="f-date" required />
      </div>
      <div class="field">
        <label>Time of meeting</label>
        <input type="time" id="f-time" />
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Person met <span class="req">*</span></label>
        <input type="text" id="f-person" placeholder="Full name" />
      </div>
      <div class="field">
        <label>Their company <span class="req">*</span></label>
        <input type="text" id="f-company" placeholder="Organisation" />
      </div>
    </div>
    <div class="field">
      <label>Meeting type <span class="req">*</span></label>
      <select id="f-type">
        <option value="">Select a category</option>
        <option>Business development</option>
        <option>Partnership</option>
        <option>Client check-in</option>
        <option>Investor meeting</option>
        <option>Industry networking</option>
        <option>Other</option>
      </select>
    </div>
    <div class="field">
      <label>What was discussed / outcome</label>
      <textarea id="f-notes" placeholder="Key points, decisions, outcomes…"></textarea>
    </div>
    <div class="field">
      <label>Next steps</label>
      <input type="text" id="f-next" placeholder="e.g. Share proposal by 30 Apr" />
    </div>
    <button class="submit-btn" onclick="submitEntry()" id="submit-btn">Submit entry →</button>
  </div>
  <div class="success-screen" id="success-section">
    <div class="success-icon">✓</div>
    <div class="success-title">Entry submitted!</div>
    <div class="success-sub">Your connect has been logged. Thank you, Surender!</div>
    <button class="another-btn" onclick="resetForm()">Log another meeting</button>
  </div>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG-1cTJ8wx-v_pKVSxz89Iyr6780dMLlwn02-FgOjZwrJoO76V6TUuf4_Z6wWy7am3/exec";
document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
async function submitEntry() {
  const date = document.getElementById('f-date').value;
  const person = document.getElementById('f-person').value.trim();
  const company = document.getElementById('f-company').value.trim();
  const type = document.getElementById('f-type').value;
  const notes = document.getElementById('f-notes').value.trim();
  const next = document.getElementById('f-next').value.trim();
  if (!date || !person || !company || !type) { alert('Please fill in all required fields (marked *).'); return; }
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  const time = document.getElementById(\'f-time\').value;
    const payload = { director: "Surender Jain", title: "Director", date, time, person, company, type, notes, next };
  try {
    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-section').style.display = 'block';
  } catch(e) {
    alert('Could not submit. Please check your connection and try again.');
    btn.disabled = false; btn.textContent = 'Submit entry →';
  }
}
function resetForm() {
  ['f-person','f-company','f-notes','f-next'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-type').value = '';
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('submit-btn').textContent = 'Submit entry →';
  document.getElementById('form-section').style.display = 'block';
  document.getElementById('success-section').style.display = 'none';
}
</script>
</body>
</html>
